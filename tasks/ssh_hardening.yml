---
# SSH hardening tasks for jumphost

- name: Ensure .ssh directory exists with correct permissions
  ansible.builtin.file:
    path: "{{ jump_host_ssh_keys_path }}"
    state: directory
    owner: "{{ jump_host_user }}"
    group: "{{ jump_host_user }}"
    mode: "0700"

- name: Deploy hardened sshd_config (the configuration used by SSH daemon)
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Ensure sshd is enabled and started
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true
